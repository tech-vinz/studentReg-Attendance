<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Student Attendance &amp; Records System</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <h1>Student Attendance &amp; Records System</h1>
    <h2>Sign in to continue</h2>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <p id="loginError" class="error-text"></p>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Login</button>
        <button type="button" class="btn btn-secondary" onclick="handleExit()">Exit</button>
      </div>
    </form>

    <p class="hint">Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
