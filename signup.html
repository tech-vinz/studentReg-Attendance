<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up — Student Attendance &amp; Records System</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <h1>Student Attendance &amp; Records System</h1>
    <h2>Create an account</h2>

    <form id="signupForm" onsubmit="handleSignup(event)">
      <label for="newUsername">Username</label>
      <input type="text" id="newUsername" required autocomplete="username">

      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" required autocomplete="new-password">

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" required autocomplete="new-password">

      <p id="signupError" class="error-text"></p>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Sign Up</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Back to Login</button>
      </div>
    </form>
  </div>

  <script src="common.js"></script>
  <script src="signup.js"></script>
</body>
</html>
